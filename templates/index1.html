<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Website</title>
</head>
<body>
    <h1>Testing Successful</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flashes">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('add_to_cart') }}" method="post">
        <fieldset>
            <legend for="flower">Select Flowers</legend>
            <select name="flower" id="flower">
                {% for flower, details in flowers.items() %}
                    <option value="{{ flower }}">{{ flower }} - ${{ details.price }}</option>
                {% endfor %}
            </select>
            <label for="quantity">Quantity</label>
            <input type="number" name="quantity" value="1" min="1">
            <input type="submit" value="Add to Cart">
        </fieldset>
    </form>
</body>
</html>
